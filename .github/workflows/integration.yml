name: Integration

# Integration tests drive the real Apple `container` runtime + .NET Aspire, so
# they run on the dedicated self-hosted macOS-27 runner with Apple `container`,
# `dotnet`, and the `aspire` CLI installed. Hosted macOS images do not provide
# Apple container or enough disk for this base-image smoke. Same-repository PRs
# run it only after the repository owner marks the change safe to test; fork and
# unapproved PR code never executes on the persistent runner. Extended coverage
# stays scheduled so a slow matrix cannot make offline fidelity optional.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  integration:
    name: integration tests
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER' &&
       contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    permissions:
      contents: read
    runs-on: [self-hosted, macos-27, apple-container]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: verify Apple container prerequisite
        run: |
          test "$(uname)" = Darwin
          container --version
      - name: Apple container offline smoke
        env:
          SHUNT_CONTAINER_INTEGRATION: '1'
        run: go test -p 1 -tags integration ./internal/image ./internal/imagecache ./internal/siding -count=1 -timeout 30m

  extended:
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    name: extended Apple container integration
    permissions:
      contents: read
    runs-on: [self-hosted, macos-27, apple-container]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: verify Apple container prerequisite
        run: |
          test "$(uname)" = Darwin
          container --version
      - name: integration tests
        env:
          SHUNT_CONTAINER_INTEGRATION: '1'
        run: go test -p 1 -tags integration ./... -count=1 -timeout 30m
