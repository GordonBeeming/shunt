name: Integration

# Integration tests drive the real Apple `container` runtime + .NET Aspire, so
# they only run on a self-hosted macOS runner with `container`, `dotnet`, and the
# `aspire` CLI installed. Trigger manually.
on:
  workflow_dispatch:

jobs:
  integration:
    name: integration tests
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: integration tests
        run: go test -tags integration ./... -count=1 -timeout 30m
