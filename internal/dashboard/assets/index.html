<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230063B2'/%3E%3Cpath d='M17 20h30v8H17zm0 16h30v8H17z' fill='white'/%3E%3C/svg%3E">
<title>shunt</title>
<style>
  /* Light by default; follows the OS theme. color-scheme above means the browser
     paints the right background on first frame — no flash. */
  :root {
    --bg: #F8F9FA; --text: #1A1A1A; --text2: #374151;
    --primary: #0063B2; --accent: #0075A3; --ui: #E9ECEF;
    --card: #FFFFFF; --up: #1E7B34; --down: #B42318; --busy: #B45309;
    --on-primary: #FFFFFF;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A1A; --text: #E0E0E0; --text2: #B7BDC7;
      --primary: #46CBFF; --accent: #46CBFF; --ui: #2C2C2C;
      --card: #242424; --up: #3FB950; --down: #F85149; --busy: #D29922;
      --on-primary: #06283D;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); line-height: 1.45;
  }
  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 20px 28px; border-bottom: 1px solid var(--ui);
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -.5px; }
  header .sub { color: var(--text2); font-size: 13px; }
  header .dot-legend { margin-left: auto; color: var(--text2); font-size: 12px; }
  main { padding: 24px 28px; max-width: 1100px; }

  /* non-prod corner ribbon — bottom-right so it never covers header content */
  #ribbon { position: fixed; bottom: 0; right: 0; width: 150px; height: 150px; overflow: hidden; z-index: 50; pointer-events: none; display: none; }
  #ribbon b {
    position: absolute; bottom: 34px; right: -40px; transform: rotate(-45deg);
    width: 210px; text-align: center; background: var(--primary); color: var(--on-primary);
    font-weight: 800; letter-spacing: 3px; font-size: 13px; padding: 7px 0;
    text-transform: uppercase; box-shadow: 0 -2px 8px rgba(0,0,0,.3);
  }

  .app { background: var(--card); border: 1px solid var(--ui); border-radius: 14px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .app > h2 { margin: 0; padding: 15px 20px; font-size: 16px; border-bottom: 1px solid var(--ui); display: flex; align-items: center; gap: 10px; }
  .app > h2 .live { font-size: 12px; font-weight: 500; color: var(--text2); }
  .app > h2 .live strong { color: var(--text); }
  .removal { margin: 14px 20px 0; padding: 11px 13px; border: 1px solid var(--busy); border-radius: 9px; background: color-mix(in srgb, var(--busy) 12%, var(--card)); }
  .removal strong { display: block; color: var(--text); }
  .removal span, .removal code { color: var(--text2); font-size: 12px; }
  .removal code { overflow-wrap: anywhere; }

  /* one route per cell: status dot + key on top, full-width url underneath so it
     never wraps mid-word into a cramped column */
  .routes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px 20px; padding: 18px 20px; }
  .route { display: flex; align-items: flex-start; gap: 9px; min-width: 0; }
  .route .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 4px; box-shadow: 0 0 0 3px rgba(0,0,0,.05); }
  .dot.up { background: var(--up); } .dot.down { background: var(--down); }
  .rmeta { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
  .route .key { font-weight: 600; font-size: 13px; }
  .route a, .route .addr { color: var(--primary); font-family: var(--mono); font-size: 11.5px; text-decoration: none; word-break: break-all; }
  .direct { color: var(--text2); font-size: 11px; font-family: var(--mono); text-decoration: none; }
  a.direct:hover { color: var(--primary); text-decoration: underline; }
  .direct.off { opacity: .5; cursor: default; }
  .route a:hover { text-decoration: underline; }
  .route a:focus-visible, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 5px; }

  .sidings { border-top: 1px solid var(--ui); padding: 14px 20px 16px; }
  .sidings .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text2); margin-bottom: 6px; }
  .siding { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--ui); }
  .siding:first-of-type { border-top: none; }
  .sinfo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .sline1, .sline2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .siding .nm { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 2px 8px; border-radius: 999px; }
  .badge.live { background: var(--up); color: #fff; }
  .badge.base { background: var(--primary); color: var(--on-primary); }
  .badge.phase { background: var(--ui); color: var(--text); }
  .guest { font-size: 11px; color: var(--text2); }
  .siding .runtime { font-size: 11px; color: var(--text2); }
  .siding .runtime.bad { color: var(--down); }
  .siding .runtime-detail { font-size: 11px; color: var(--text2); }
  .siding .status { font-size: 12px; color: var(--busy); }
  .siding .progress { display: grid; gap: 2px; margin: 2px 0 0; color: var(--text2); font: 11px/1.35 var(--mono); }
  .siding .actions { display: flex; flex: none; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-left: auto; }
  .action-fence { color: var(--busy); font-size: 12px; font-weight: 600; }
  button {
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--primary); color: var(--primary); background: var(--card);
    border-radius: 7px; padding: 4px 12px;
  }
  button:hover:not(:disabled) { background: var(--primary); color: var(--on-primary); }
  button.primary { background: var(--primary); color: var(--on-primary); }
  button.primary:hover:not(:disabled) { background: #004e8c; }
  button:disabled { opacity: .45; cursor: default; }
  .empty { color: var(--text2); padding: 40px 0; text-align: center; }
  main { padding-bottom: 56px; } /* clear the fixed footer */
  footer {
    position: fixed; bottom: 0; left: 0; z-index: 40;
    color: var(--text2); font-size: 11.5px; padding: 8px 14px;
    background: var(--bg); border-top: 1px solid var(--ui); border-right: 1px solid var(--ui);
    border-top-right-radius: 8px; max-width: 92vw;
  }
  @media (max-width: 420px) {
    header { align-items: flex-start; flex-wrap: wrap; padding: 16px; }
    header .dot-legend { margin-left: 0; width: 100%; }
    main { padding: 16px; }
    .routes, .sidings { padding-left: 14px; padding-right: 14px; }
    .siding { align-items: flex-start; flex-direction: column; }
    .siding .actions { justify-content: flex-start; margin-left: 0; }
    footer { max-width: 100%; position: static; border-right: 0; border-top-right-radius: 0; }
    main { padding-bottom: 16px; }
  }
</style>
</head>
<body>
<div id="ribbon"><b id="ribbon-text"></b></div>
<header>
  <h1>shunt</h1>
  <span class="sub" id="sub">front door</span>
  <span class="dot-legend"><span class="dot up" style="display:inline-block;width:9px;height:9px;border-radius:50%;box-shadow:none"></span> up &nbsp; <span class="dot down" style="display:inline-block;width:9px;height:9px;border-radius:50%;box-shadow:none"></span> down</span>
</header>
<main id="apps"><div class="empty">Loading…</div></main>
<footer>Lifecycle: worktree → start → guest → park → start again · disk figures belong in <code>shunt space</code>; logical clone totals are not reclaimable</footer>

<script>
const $ = (s) => document.querySelector(s);
let firstLoad = true;
let csrfToken = '';

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function post(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json', 'X-Shunt-CSRF': csrfToken}, body: JSON.stringify(body)});
  if(!r.ok){ alert(await r.text()); }
  return r.ok;
}

function routeHTML(r){
  // The dot is a front-door check (a 502/503/504 or no response reads as down), so
  // "down" means the app OR the front door itself. The guest IP + dashboard link on
  // the siding row let you check the app past Caddy in a real browser.
  const dot = `<span class="dot ${r.up?'up':'down'}" title="${r.up?'serving via the front door':'not serving via the front door'}"></span>`;
  const target = r.kind === 'http'
    ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>`
    : `<span class="addr">${esc(r.url)}</span>`;
  return `<div class="route">${dot}<div class="rmeta"><span class="key">${esc(r.key)}</span>${target}</div></div>`;
}

// JSON preserves the app/siding tuple boundary before URI encoding. Delimiter
// concatenation is not injective: (a-b,c) and (a,b-c) both became a-b-c.
function sidingKey(appName, s){ return `siding-${encodeURIComponent(JSON.stringify([String(appName), String(s.name)]))}`; }

function actionHTML(appName, s, removalActive){
  if(removalActive) return '<span class="action-fence">Removal in progress</span>';
  const busy = s.status && s.status.indexOf('…') >= 0;
  const a = esc(JSON.stringify(appName)), n = esc(JSON.stringify(s.name));
  const guestPhase = s.phase === 'guest';
  const running = s.runtime === 'running';
  const startCopy = s.phase === 'worktree' ? 'Materialize' : s.phase === 'parked' ? 'Restore' : 'Start';
  const canSwitch = guestPhase && running && s.serving && !s.live;
  const sw = canSwitch ? `<button aria-label="Switch ${esc(s.name)} live" onclick="doSwitch(${a},${n})" ${busy?'disabled':''}>Switch</button>` : '';
  const start = (!guestPhase || !running || !s.serving)
    ? `<button class="primary" aria-label="${startCopy} ${esc(s.name)}" onclick="doStart(${a},${n})" ${busy?'disabled':''}>${startCopy}</button>` : '';
  const stop = guestPhase && running
    ? `<button aria-label="Stop ${esc(s.name)} guest" onclick="doStop(${a},${n})" ${busy?'disabled':''}>Stop</button>` : '';
  const park = guestPhase && !s.live
    ? `<button aria-label="Park ${esc(s.name)}" onclick="doPark(${a},${n})" ${busy?'disabled':''}>Park</button>` : '';
  return sw + start + stop + park;
}

function sidingHTML(appName, s, removalActive){
  const liveBadge = s.live ? '<span class="badge live">live</span>' : '';
  const baseBadge = s.base ? '<span class="badge base">base</span>' : '';
  const phaseBadge = `<span class="badge phase" title="persisted siding phase">${esc(s.phase || 'worktree')}</span>`;
  const status = `<span class="status terminal-status" role="status" aria-live="polite">${esc(s.status || '')}</span>`;
  const runtimeBad = s.runtime === 'runtime-unavailable' ? ' bad' : '';
  const runtime = `<span class="runtime${runtimeBad}">runtime: ${esc(s.runtime || 'missing')}${s.runtime === 'running' ? (s.serving ? ' · app serving' : ' · app idle') : ''}</span>`;
  const runtimeDetail = s.runtimeDetail ? `<span class="runtime-detail">${esc(s.runtimeDetail)}</span>` : '';
  const progress = `<div class="progress" role="log" aria-live="polite" aria-relevant="additions" data-progress-count="0">${(s.progress || []).map(line => `<span>${esc(line)}</span>`).join('')}</div>`;
  const running = s.runtime === 'running';
  // Direct-access line: the guest's Aspire dashboard link first, then its IP. The link is
  // only live when the app is actually running (opens in the browser — Local Network
  // access); otherwise it's shown disabled since you can't reach it.
  let line2 = '';
  if (s.ip) {
    const dash = s.dashboard
      ? (running
          ? `<a class="direct" href="${esc(s.dashboard)}" target="_blank" rel="noopener">dashboard</a>`
          : `<span class="direct off" title="start the siding to reach its dashboard">dashboard</span>`)
      : '';
    line2 = `<div class="sline2">${dash}<span class="guest">${esc(s.ip)}</span></div>`;
  }
  return `<div class="siding" id="${sidingKey(appName, s)}">
    <div class="sinfo">
      <div class="sline1"><span class="nm">${esc(s.name)}</span> ${liveBadge} ${baseBadge} ${phaseBadge} ${status}</div>
      <div class="sline2">${runtime} ${runtimeDetail}</div>
      ${progress}
      ${line2}
    </div>
    <div class="actions">${actionHTML(appName, s, removalActive)}</div></div>`;
}

function appHTML(a){
  const rts = a.routes || [], sds = a.sidings || [];   // server may send null for empty
  const live = a.liveSiding ? `live: <strong>${esc(a.liveSiding)}</strong>` : 'nothing live';
  const routes = rts.length ? rts.map(routeHTML).join('') : '<span class="guest">no routes</span>';
  const removal = a.removal
    ? `<div class="removal" role="status"><strong>Removal in progress</strong><span>Siding ${esc(a.removal.siding)} · stage ${esc(a.removal.stage)} · started ${esc(a.removal.age)} ago</span><br><code>${esc(a.removal.resume)}</code></div>`
    : '';
  const sidings = sds.length ? sds.map(s => sidingHTML(a.name, s, !!a.removal)).join('') : '<span class="guest">no sidings — `shunt new`</span>';
  return `<section class="app">
    <h2>${esc(a.name)} <span class="live">${live}</span></h2>
    ${removal}
    <div class="routes">${routes}</div>
    <div class="sidings"><div class="lbl">Sidings</div>${sidings}</div>
  </section>`;
}

function reconcileProgress(progress, lines){
  if(!progress) return;
  const existing = [...progress.querySelectorAll('span')].map(entry => entry.textContent);
  const next = lines || [];
  // Action progress is a bounded trailing window. Keep matching entries and only
  // append genuine additions, so assistive technology sees one update at a time.
  let retained = 0;
  for(let count = Math.min(existing.length, next.length); count > 0; count--) {
    if(existing.slice(existing.length - count).every((line, index) => line === next[index])) { retained = count; break; }
  }
  while(progress.children.length > retained) progress.firstElementChild.remove();
  for(const line of next.slice(retained)) {
    const entry = document.createElement('span'); entry.textContent = line; progress.append(entry);
  }
}

function appNode(a){
  const template = document.createElement('template');
  template.innerHTML = appHTML(a);
  const node = template.content.firstElementChild;
  node.dataset.app = a.name;
  return node;
}

function renderApps(apps){
  const root = $('#apps');
  if(!apps || !apps.length) {
    root.innerHTML = '<div class="empty">No apps registered yet — run <code>shunt app add</code> in a repo.</div>';
    return;
  }
  root.querySelector('.empty')?.remove();
  const wanted = new Set(apps.map(app => app.name));
  root.querySelectorAll('.app[data-app]').forEach(node => { if(!wanted.has(node.dataset.app)) node.remove(); });
  for(const app of apps) {
    const currentApp = root.querySelector(`.app[data-app="${CSS.escape(app.name)}"]`);
    const nextApp = appNode(app);
    if(!currentApp) {
      root.append(nextApp);
      continue;
    }
    for(const siding of app.sidings || []) {
      const id = sidingKey(app.name, siding);
      // Scope lookup to this app as well as using an injective tuple ID. This keeps
      // progress/status identity attached to the right siding even for hostile or
      // formerly-colliding names.
      const currentSiding = currentApp.querySelector(`#${CSS.escape(id)}`);
      const nextSiding = nextApp.querySelector(`#${CSS.escape(id)}`);
      if(currentSiding && nextSiding) {
        const progress = currentSiding.querySelector('[role="log"]');
        if(progress) {
          reconcileProgress(progress, siding.progress);
          nextSiding.querySelector('[role="log"]')?.replaceWith(progress);
        }
        const status = currentSiding.querySelector('.terminal-status');
        if(status) {
          status.textContent = siding.status || '';
          nextSiding.querySelector('.terminal-status')?.replaceWith(status);
        }
      }
    }
    currentApp.replaceWith(nextApp);
    // Re-appending each reconciled app makes DOM order follow the latest response.
    root.append(nextApp);
  }
}

async function doSwitch(app, sd){
  if(!confirm(`Switch the ${app} front door to "${sd}"?\n\nThis repoints the shared ports away from the current live siding — it can interrupt another session/agent working against it.`)) return;
  if(await post('/api/switch', {project:app, siding:sd})) refresh();
}
async function doStart(app, sd){
  if(await post('/api/start', {project:app, siding:sd})) refresh();
}
async function doStop(app, sd){
  if(!confirm(`Stop "${sd}"?\n\nThis stops the app + its guest — it can interrupt anyone using it. Code, data, and the guest remain.`)) return;
  if(await post('/api/stop', {project:app, siding:sd})) refresh();
}
async function doPark(app, sd){
  if(!confirm(`Park "${sd}"?\n\nThis removes only its recreatable Apple guest. The worktree, branch, data, and output stay in place, and Start creates the guest again.`)) return;
  if(await post('/api/park', {project:app, siding:sd})) refresh();
}

function applyChannel(ch){
  const r = $('#ribbon');
  if(ch && ch !== 'release'){
    $('#ribbon-text').textContent = ch;
    r.style.display = 'block';
    $('#sub').textContent = 'front door · ' + ch;
    document.title = 'shunt · ' + ch;
  } else { r.style.display = 'none'; }
}

async function refresh(){
  let st;
  try {
    st = await (await fetch('/api/state')).json();   // a real fetch/transport failure
  } catch(e){
    if(firstLoad) $('#apps').innerHTML = '<div class="empty">Dashboard server unreachable.</div>';
    firstLoad = false;
    return;
  }
  firstLoad = false;
  try {                                              // a render bug is NOT "unreachable"
    applyChannel(st.channel);
    csrfToken = st.csrfToken || '';
    renderApps(st.apps);
  } catch(e){
    $('#apps').innerHTML = '<div class="empty">render error: ' + esc(e.message) + '</div>';
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
